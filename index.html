<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coach Allemand Multi-IA (v1.3.1)</title>
<style>
  :root { --primary:#2563eb; --danger:#dc2626; --success:#16a34a; --bg:#f8fafc; --card:#fff; --text:#1e293b; }
  * { box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { background:var(--bg); color:var(--text); margin:0; padding:16px; display:flex; justify-content:center; }
  .container { width:100%; max-width:500px; }
  h1 { font-size:1.35rem; text-align:center; margin:0 0 2px; color:var(--primary); }
  .version-tag { font-size:0.75rem; color:#64748b; text-align:center; margin:0 0 14px; }
  .card { background:var(--card); border-radius:16px; padding:18px; box-shadow:0 4px 6px -1px rgba(0,0,0,.1); margin-bottom:16px; }
  label { display:block; font-weight:600; font-size:.9rem; margin-bottom:5px; }
  select, input, textarea { width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:10px; font-size:1rem; margin-bottom:12px; background:#fff; color:var(--text); }
  textarea { resize:vertical; min-height:95px; }
  button { width:100%; padding:14px; border:none; border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:disabled { background:#94a3b8; }
  .btn-record { background:var(--success); color:#fff; font-size:1.1rem; padding:18px; }
  .btn-record.recording { background:var(--danger); }
  .btn-secondary { background:#e2e8f0; color:var(--text); margin-top:10px; }
  .btn-small { padding:9px; font-size:0.85rem; background:#eff6ff; color:var(--primary); border:1px solid #bfdbfe; margin-bottom:12px; }
  .progress { font-size:.85rem; color:#64748b; text-align:center; margin-bottom:8px; font-weight:600; }
  .sentence-box { font-size:1.2rem; font-weight:700; text-align:center; padding:18px 10px; background:#eff6ff; border-radius:12px; margin-bottom:16px; border:1px solid #bfdbfe; }
  .feedback-box { margin-top:16px; padding:15px; border-radius:12px; background:#f1f5f9; font-size:.95rem; line-height:1.55; display:none; }
  .feedback-box strong { color:#0f172a; }
  .status-box { margin-top:12px; padding:10px; border-radius:10px; font-size:.9rem; text-align:center; display:none; }
  .status-info { background:#eff6ff; color:var(--primary); font-weight:600; }
  .status-err { background:#fef2f2; color:var(--danger); border:1px solid #fecaca; text-align:left; white-space:pre-wrap; }
  .hidden { display:none; }
  .link-btn { text-align:right; font-size:.85rem; color:var(--primary); cursor:pointer; margin-bottom:10px; text-decoration:underline; }
  .keys-box { background:#f8fafc; padding:12px; border-radius:10px; border:1px solid #e2e8f0; margin-bottom:14px; }
</style>
</head>
<body>
<div class="container">
  <h1>🇩🇪 Entraîneur Allemand Multi-IA</h1>
  <div class="version-tag">Version 1.3.1</div>

  <div id="setup-card" class="card">
    <label for="model-select">Modèles réellement disponibles sur vos clés :</label>
    <select id="model-select" onchange="localStorage.setItem('selected_model', this.value)">
      <option value="">Chargement des modèles actifs...</option>
    </select>

    <div class="link-btn" onclick="document.getElementById('keys-panel').classList.toggle('hidden')">🔑 Gérer mes clés API</div>

    <div id="keys-panel" class="keys-box">
      <label for="key-groq">Clé API GroqCloud (gsk_...) :</label>
      <input type="password" id="key-groq" placeholder="Collez votre clé Groq">
      <label for="key-gemini">Clé API Google AI Studio (AIza... ou AQ...) :</label>
      <input type="password" id="key-gemini" placeholder="Collez votre clé Gemini">
      <label for="key-openrouter">Clé API OpenRouter (sk-or-...) :</label>
      <input type="password" id="key-openrouter" placeholder="Collez votre clé OpenRouter">
      <button type="button" class="btn-small" onclick="refreshAllModels()">🔄 Enregistrer les clés & Actualiser les modèles</button>
    </div>

    <label for="prompt-input">Votre consigne de génération :</label>
    <textarea id="prompt-input">Génère 10 phrases de la vie de tous les jours en français qui nécessitent d'utiliser en allemand les mots "normalerweise", "grundsätzlich" ou "eigentlich" selon le contexte, afin de bien apprendre leurs nuances.</textarea>

    <button id="generate-btn" class="btn-primary">Générer les 10 phrases</button>
    <div id="setup-status" class="status-box"></div>
  </div>

  <div id="practice-card" class="card hidden">
    <div class="link-btn" id="back-btn">⚙️ Changer de modèle / consigne</div>
    <div class="progress" id="progress-text">Phrase 1 / 10</div>
    <div class="sentence-box" id="french-sentence">...</div>
    <button id="record-btn" class="btn-record">🎙️ Appuyer pour répondre en allemand</button>
    <div id="practice-status" class="status-box"></div>
    <div id="feedback-box" class="feedback-box"></div>
    <button id="next-btn" class="btn-secondary hidden">Phrase suivante ➡️</button>
  </div>
</div>

<script>
let sentences = [], currentIndex = 0, mediaRecorder = null, audioChunks = [], isRecording = false, whisperModel = "whisper-large-v3";

// Formatage propre du Markdown renvoyé par les IA (**gras**, *italique*, titres, listes)
function formatMarkdown(text) {
  let html = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  html = html.replace(/^###\s+(.*)$/gm, "<strong>$1</strong>");
  html = html.replace(/^##\s+(.*)$/gm, "<strong>$1</strong>");
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*\n]+?)\*/g, "<em>$1</em>");
  html = html.replace(/^\s*-\s+/gm, "• ");
  html = html.replace(/\n/g, "<br>");
  return html;
}

function showStatus(id, msg, isError = false) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = "status-box " + (isError ? "status-err" : "status-info");
  el.style.display = "block";
}
function hideStatus(id) { document.getElementById(id).style.display = "none"; }

function saveData() {
  const keys = {};
  ["groq", "gemini", "openrouter"].forEach(k => {
    const v = document.getElementById("key-" + k).value.trim();
    if (v) localStorage.setItem("key_" + k, v);
    keys[k] = v || localStorage.getItem("key_" + k) || "";
  });
  return keys;
}

async function refreshAllModels() {
  const keys = saveData();
  const select = document.getElementById("model-select");
  const prevChoice = localStorage.getItem("selected_model");
  select.innerHTML = "<option value=''>Recherche des modèles actifs...</option>";
  let totalAdded = 0;

  if (keys.groq) {
    try {
      const res = await fetch("https://api.groq.com/openai/v1/models", { headers: { "Authorization": "Bearer " + keys.groq } });
      const data = await res.json();
      if (data.data) {
        const w = data.data.find(m => m.id.includes("whisper"));
        if (w) whisperModel = w.id;
        const chatModels = data.data.filter(m => !m.id.includes("whisper") && !m.id.includes("guard") && !m.id.includes("tts"));
        if (chatModels.length) {
          const grp = document.createElement("optgroup");
          grp.label = "GroqCloud (Ultra-rapide + Whisper)";
          chatModels.forEach(m => {
            const opt = document.createElement("option");
            opt.value = "groq|" + m.id;
            opt.textContent = m.id + " (Groq)";
            grp.appendChild(opt);
            totalAdded++;
          });
          select.appendChild(grp);
        }
      }
    } catch (e) {}
  }

  if (keys.gemini) {
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${keys.gemini}`);
      const data = await res.json();
      if (data.models) {
        const gemModels = data.models.filter(m => m.supportedGenerationMethods?.includes("generateContent") && m.name.includes("gemini"));
        if (gemModels.length) {
          const grp = document.createElement("optgroup");
          grp.label = "Google Gemini (Audio direct natif)";
          gemModels.forEach(m => {
            const cleanId = m.name.replace("models/", "");
            const opt = document.createElement("option");
            opt.value = "gemini|" + cleanId;
            opt.textContent = (m.displayName || cleanId);
            grp.appendChild(opt);
            totalAdded++;
          });
          select.appendChild(grp);
        }
      }
    } catch (e) {}
  }

  if (keys.openrouter) {
    try {
      const res = await fetch("https://openrouter.ai/api/v1/models", { headers: { "Authorization": "Bearer " + keys.openrouter } });
      const data = await res.json();
      if (data.data) {
        const freeModels = data.data.filter(m => m.id.endsWith(":free"));
        if (freeModels.length) {
          const grp = document.createElement("optgroup");
          grp.label = "OpenRouter (Modèles :free + Whisper Groq)";
          freeModels.forEach(m => {
            const opt = document.createElement("option");
            opt.value = "openrouter|" + m.id;
            opt.textContent = m.name.replace(" (free)", "") + " (Gratuit)";
            grp.appendChild(opt);
            totalAdded++;
          });
          select.appendChild(grp);
        }
      }
    } catch (e) {}
  }

  if (totalAdded > 0) {
    select.remove(0);
    if (prevChoice && [...select.options].some(o => o.value === prevChoice)) select.value = prevChoice;
    localStorage.setItem("selected_model", select.value);
    document.getElementById("keys-panel").classList.add("hidden");
    showStatus("setup-status", `${totalAdded} modèles actifs détectés sur vos clés !`);
    setTimeout(() => hideStatus("setup-status"), 2500);
  } else {
    select.innerHTML = "<option value=''>Aucun modèle trouvé — Vérifiez vos clés</option>";
    document.getElementById("keys-panel").classList.remove("hidden");
  }
}

async function callGemini(model, apiKey, text, audioB64 = null, audioMime = null) {
  const parts = [{ text }];
  if (audioB64) parts.push({ inline_data: { mime_type: audioMime, data: audioB64 } });
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: [{ parts }] })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates[0].content.parts[0].text;
}

async function callOpenAI(url, apiKey, model, text) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey, "HTTP-Referer": window.location.href },
    body: JSON.stringify({ model, messages: [{ role: "user", content: text }] })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return data.choices[0].message.content;
}

async function transcribeGroq(blob, groqKey) {
  const fd = new FormData();
  fd.append("file", blob, "audio.webm");
  fd.append("model", whisperModel);
  fd.append("language", "de");
  const res = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + groqKey },
    body: fd
  });
  const data = await res.json();
  if (data.error) throw new Error("Whisper Groq : " + data.error.message);
  return data.text;
}

document.getElementById("generate-btn").addEventListener("click", async () => {
  hideStatus("setup-status");
  const keys = saveData();
  const val = document.getElementById("model-select").value;
  if (!val) return showStatus("setup-status", "Veuillez sélectionner un modèle.", true);
  const [provider, model] = val.split("|");
  const userPrompt = document.getElementById("prompt-input").value.trim();

  if (provider === "openrouter" && !keys.groq) {
    document.getElementById("keys-panel").classList.remove("hidden");
    return showStatus("setup-status", "La clé Groq est aussi requise pour la transcription vocale Whisper.", true);
  }

  const btn = document.getElementById("generate-btn");
  btn.disabled = true;
  showStatus("setup-status", "Génération des 10 phrases en cours...");

  const sysPrompt = `Tu es un professeur d'allemand. Consigne : "${userPrompt}". Génère exactement 10 phrases en français. Réponds UNIQUEMENT par un tableau JSON valide de 10 chaînes de caractères, sans texte autour ni balises markdown. Exemple : ["Phrase 1", "Phrase 2"]`;

  try {
    let raw = "";
    if (provider === "groq") raw = await callOpenAI("https://api.groq.com/openai/v1/chat/completions", keys.groq, model, sysPrompt);
    else if (provider === "gemini") raw = await callGemini(model, keys.gemini, sysPrompt);
    else raw = await callOpenAI("https://openrouter.ai/api/v1/chat/completions", keys.openrouter, model, sysPrompt);

    const start = raw.indexOf("[");
    const end = raw.lastIndexOf("]");
    if (start === -1 || end === -1) throw new Error("Réponse invalide du modèle : " + raw);
    sentences = JSON.parse(raw.slice(start, end + 1));
    currentIndex = 0;

    hideStatus("setup-status");
    document.getElementById("setup-card").classList.add("hidden");
    document.getElementById("practice-card").classList.remove("hidden");
    renderSentence();
  } catch (err) {
    showStatus("setup-status", "Erreur : " + err.message, true);
  } finally {
    btn.disabled = false;
  }
});

function renderSentence() {
  document.getElementById("progress-text").textContent = `Phrase ${currentIndex + 1} / ${sentences.length}`;
  document.getElementById("french-sentence").textContent = sentences[currentIndex];
  document.getElementById("feedback-box").style.display = "none";
  document.getElementById("next-btn").classList.add("hidden");
  document.getElementById("record-btn").textContent = "🎙️ Appuyer pour répondre en allemand";
  hideStatus("practice-status");
}

document.getElementById("back-btn").addEventListener("click", () => {
  document.getElementById("practice-card").classList.add("hidden");
  document.getElementById("setup-card").classList.remove("hidden");
});

document.getElementById("next-btn").addEventListener("click", () => {
  currentIndex++;
  if (currentIndex < sentences.length) renderSentence();
  else { alert("Bravo ! Série terminée."); document.getElementById("back-btn").click(); }
});

document.getElementById("record-btn").addEventListener("click", async () => {
  const btn = document.getElementById("record-btn");
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const mime = mediaRecorder.mimeType || "audio/webm";
        evaluateAudio(new Blob(audioChunks, { type: mime }), mime);
      };
      mediaRecorder.start();
      isRecording = true;
      btn.classList.add("recording");
      btn.textContent = "⏹️ Appuyer pour envoyer la réponse";
    } catch (err) {
      showStatus("practice-status", "Erreur micro : " + err.message, true);
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove("recording");
    btn.textContent = "🎙️ Réessayer";
  }
});

async function evaluateAudio(blob, mime) {
  const keys = saveData();
  const [provider, model] = document.getElementById("model-select").value.split("|");
  const fr = sentences[currentIndex];
  const ctx = document.getElementById("prompt-input").value;
  document.getElementById("feedback-box").style.display = "none";

  try {
    let reply = "";
    if (provider === "gemini") {
      showStatus("practice-status", "Écoute et analyse par Gemini...");
      const b64 = await new Promise(r => { const rd = new FileReader(); rd.onloadend = () => r(rd.result.split(",")[1]); rd.readAsDataURL(blob); });
      const p = `Tu es professeur d'allemand. Contexte : "${ctx}". Phrase française : "${fr}". Écoute l'audio et réponds en français :\n1. 🗣️ Ce que j'ai entendu : (transcription exacte en allemand)\n2. ✅ Verdict : (validation du mot-clé et de la grammaire)\n3. 💡 Correction : (meilleure traduction naturelle et brève explication).`;
      reply = await callGemini(model, keys.gemini, p, b64, mime.split(";")[0]);
    } else {
      showStatus("practice-status", "1/2 Transcription vocale (Whisper)...");
      const spoken = await transcribeGroq(blob, keys.groq);
      showStatus("practice-status", "2/2 Correction grammaticale...");
      const p = `Tu es professeur d'allemand. Contexte : "${ctx}". Phrase française : "${fr}". L'élève a dit à l'oral : "${spoken}". Réponds en français :\n1. 🗣️ Ce que j'ai entendu : "${spoken}"\n2. ✅ Verdict : (validation du mot-clé et de la grammaire)\n3. 💡 Correction : (meilleure traduction naturelle et brève explication).`;
      reply = provider === "groq"
        ? await callOpenAI("https://api.groq.com/openai/v1/chat/completions", keys.groq, model, p)
        : await callOpenAI("https://openrouter.ai/api/v1/chat/completions", keys.openrouter, model, p);
    }
    hideStatus("practice-status");
    const fb = document.getElementById("feedback-box");
    fb.innerHTML = formatMarkdown(reply);
    fb.style.display = "block";
    document.getElementById("next-btn").classList.remove("hidden");
  } catch (err) {
    showStatus("practice-status", "Erreur analyse : " + err.message, true);
  }
}

["groq", "gemini", "openrouter"].forEach(k => {
  const val = localStorage.getItem("key_" + k);
  if (val) document.getElementById("key-" + k).value = val;
});
refreshAllModels();
</script>
</body>
</html>
